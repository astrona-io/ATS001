training:
  id: ATS001
  title: Application Deployment
  description: Detailed CKAD teaching with module playgrounds, guided hands-on practice
    and reusable YAML knowledge checks. Technical content remains draft for review.
  certification:
    name: Certified Kubernetes Application Developer
    code: CKAD
    provider: CNCF / Linux Foundation
    domain: Application Deployment
    weight: 20
    competencies:
    - Use Kubernetes primitives to implement common deployment strategies (e.g. blue/green
      or canary)
    - Understand Deployments and how to perform rolling updates
    - Use the Helm package manager to deploy existing packages
    - Kustomize
