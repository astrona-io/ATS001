apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-green
  namespace: venus
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
      version: green
  template:
    metadata:
      labels:
        app: web
        version: green
    spec:
      containers:
        - name: nginx
          image: nginx:1.31-alpine
---
apiVersion: v1
kind: Service
metadata:
  name: web-svc
  namespace: venus
spec:
  selector:
    app: web
    version: blue
  ports:
    - name: http
      port: 80
      targetPort: 80
