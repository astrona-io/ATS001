apiVersion: v1
kind: Namespace
metadata:
  name: venus
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-blue
  namespace: venus
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
      version: blue
  template:
    metadata:
      labels:
        app: web
        version: blue
    spec:
      containers:
        - name: nginx
          image: nginx:1.31-alpine
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-green
  namespace: venus
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
      version: green
  template:
    metadata:
      labels:
        app: web
        version: green
    spec:
      containers:
        - name: nginx
          image: nginx:1.30-alpine
---
apiVersion: v1
kind: Service
metadata:
  name: web-svc
  namespace: venus
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: 80
