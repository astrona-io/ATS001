apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: probe-canary
  namespace: starfleet
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-weight: "20"
spec:
  ingressClassName: nginx
  rules:
  - host: probe.starfleet.test
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: probe-canary
            port:
              number: 80
