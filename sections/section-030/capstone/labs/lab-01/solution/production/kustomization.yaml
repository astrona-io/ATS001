apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../base
configMapGenerator:
- name: probe-settings
  literals:
  - greeting=hello-production
labels:
- pairs:
    tier: production
  includeTemplates: true
patches:
- target:
    kind: Deployment
    name: probe
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 3
    - op: replace
      path: /spec/template/spec/containers/0/env/0/value
      value: v2
    - op: add
      path: /spec/template/spec/volumes/-
      value:
        name: settings
        configMap:
          name: probe-settings
    - op: add
      path: /spec/template/spec/containers/0/volumeMounts/-
      value:
        name: settings
        mountPath: /settings
        readOnly: true
