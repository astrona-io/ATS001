apiVersion: apps/v1
kind: Deployment
metadata:
  name: tea
  namespace: tea-two
spec:
  replicas: 5
  selector:
    matchLabels:
      app: tea
      track: stable
  template:
    metadata:
      labels:
        app: tea
        track: stable
    spec:
      containers:
        - name: nginx
          image: nginx:1-alpine
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tea-canary
  namespace: tea-two
spec:
  replicas: 5
  selector:
    matchLabels:
      app: tea
      track: canary
  template:
    metadata:
      labels:
        app: tea
        track: canary
    spec:
      containers:
        - name: nginx
          image: nginx:1-alpine
---
apiVersion: v1
kind: Service
metadata:
  name: tea
  namespace: tea-two
spec:
  type: NodePort
  selector:
    app: tea
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30030
